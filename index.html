<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8' />
    <title>Ageing in Place: Are Singapore's Seniors Well-Served?</title>
    <meta name='viewport' content='initial-scale=1,maximum-scale=1,user-scalable=no' />
    <script src='https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.js'></script>
    <link href='https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.css' rel='stylesheet' />
    <script src="https://unpkg.com/intersection-observer@0.12.0/intersection-observer.js"></script>
    <script src="https://unpkg.com/scrollama"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Karla:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; padding: 0; font-family: 'Karla', sans-serif; }
        a, a:hover, a:visited { color: #0071bc; }
        #map { top: 0; height: 100vh; width: 100vw; position: fixed; }
        #header { margin: auto; width: 100%; position: relative; z-index: 5; padding-top: 30px; padding-bottom: 30px; opacity: .9; }
        #header h1, #header h2 { margin: 0; padding: 2vh 2vw; text-align: center; font-weight: 700; }
        #header p { margin: 0; padding: 2vh 2vw; text-align: center; font-weight: 400; }
        #footer { width: 100%; min-height: 5vh; padding-top: 2vh; padding-bottom: 2vh; text-align: center; line-height: 25px; font-size: 13px; position: relative; z-index: 5; }
        #features { padding-top: 10vh; padding-bottom: 10vh; }
        .hidden { visibility: hidden; }
        .centered { width: 50vw; margin: 0 auto; }
        .lefty { width: 33vw; margin-left: 5vw; }
        .righty { width: 33vw; margin-left: 62vw; }
        .fully { width: 100%; margin: auto; }
        .light { color: #444; background-color: #fafafa; }
        .dark { color: #fafafa; background-color: #444; }
        .step { padding-bottom: 50vh; opacity: 0.25; }
        .step.active { opacity: 0.9; }
        .step div { padding: 25px 50px; line-height: 25px; font-size: 13px; }
        .step img { width: 100%; }
        @media (max-width: 750px) {
            .centered, .lefty, .righty, .fully { width: 90vw; margin: 0 auto; }
        }
        .mapboxgl-canvas-container.mapboxgl-touch-zoom-rotate.mapboxgl-touch-drag-pan,
        .mapboxgl-canvas-container.mapboxgl-touch-zoom-rotate.mapboxgl-touch-drag-pan .mapboxgl-canvas {
            touch-action: unset;
        }
        #legend {
            position: fixed;
            bottom: 40px;
            background: #fafafa;
            border-radius: 3px;
            padding: 25px 50px;
            z-index: 10;
            font-family: 'Karla', sans-serif;
            font-size: 11px;
            min-width: 120px;
            max-width: 220px;
            line-height: 25px;
            transition: opacity 0.4s ease, left 0.4s ease, right 0.4s ease;
        }
        #legend.pos-left { left: 5vw; right: auto; }
        #legend.pos-right { right: 5vw; left: auto; }
        #legend.pos-none { opacity: 0; pointer-events: none; }
        #legend h4 {
            margin: 0 0 6px 0;
            font-size: 10px;
            font-weight: 700;
            color: #333;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .legend-item {
            display: flex;
            align-items: flex-start;
            margin-bottom: 3px;
            gap: 6px;
        }
        .legend-swatch {
            width: 11px;
            height: 11px;
            border-radius: 2px;
            flex-shrink: 0;
            margin-top: 1px;
            border: 1px solid #ccc;
        }
        .legend-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            flex-shrink: 0;
            margin-top: 1px;
        }
        .legend-label { color: #444; line-height: 1.3; }
    </style>
</head>
<body>
    <div id="map"></div>
    <div id="story"></div>
    <div id="legend" class="pos-left"></div>

    <script src="./config.js"></script>
    <script>
        var initLoad = true;
        var layerTypes = {
            'fill': ['fill-opacity'],
            'line': ['line-opacity'],
            'circle': ['circle-opacity', 'circle-stroke-opacity'],
            'symbol': ['icon-opacity', 'text-opacity'],
            'raster': ['raster-opacity'],
            'fill-extrusion': ['fill-extrusion-opacity'],
            'heatmap': ['heatmap-opacity']
        };
        var alignments = {
            'left': 'lefty',
            'center': 'centered',
            'right': 'righty',
            'full': 'fully'
        };

        function getLayerPaintType(layer) {
            var mapLayer = map.getLayer(layer);
            if (!mapLayer) return null;
            return layerTypes[mapLayer.type];
        }

        function setLayerOpacity(layer) {
            if (!map.getLayer(layer.layer)) return;
            var paintProps = getLayerPaintType(layer.layer);
            if (!paintProps) return;
            paintProps.forEach(function(prop) {
                var options = {};
                if (layer.duration) {
                    map.setPaintProperty(layer.layer, prop + '-transition', { duration: layer.duration });
                    options = { duration: layer.duration };
                }
                try {
                    map.setPaintProperty(layer.layer, prop, layer.opacity, options);
                } catch(e) {}
            });
        }

        function updateLegend(chapterId) {
            var legendEl = document.getElementById('legend');
            if (!config.legend || !config.legend[chapterId]) {
                legendEl.className = 'pos-none';
                return;
            }
            var data = config.legend[chapterId];
            if (data.position === 'none' || !data.items || data.items.length === 0) {
                legendEl.className = 'pos-none';
                return;
            }
            var html = '<h4>' + data.title + '</h4>';
            data.items.forEach(function(item) {
                var swatchClass = item.dot ? 'legend-dot' : 'legend-swatch';
                html += '<div class="legend-item">';
                html += '<div class="' + swatchClass + '" style="background:' + item.color + ';"></div>';
                html += '<span class="legend-label">' + item.label + '</span>';
                html += '</div>';
            });
            legendEl.innerHTML = html;
            legendEl.className = 'pos-' + data.position;
        }

        var story = document.getElementById('story');
        var features = document.createElement('div');
        features.setAttribute('id', 'features');

        var header = document.createElement('div');
        if (config.title) {
            var titleText = document.createElement('h1');
            titleText.innerText = config.title;
            header.appendChild(titleText);
        }
        if (config.subtitle) {
            var subtitleText = document.createElement('h2');
            subtitleText.innerText = config.subtitle;
            header.appendChild(subtitleText);
        }
        if (config.byline) {
            var bylineText = document.createElement('p');
            bylineText.innerText = config.byline;
            header.appendChild(bylineText);
        }
        if (header.innerText.length > 0) {
            header.classList.add(config.theme);
            header.setAttribute('id', 'header');
            story.appendChild(header);
        }

        config.chapters.forEach((record, idx) => {
            var container = document.createElement('div');
            var chapter = document.createElement('div');
            if (record.title) {
                var title = document.createElement('h3');
                title.innerText = record.title;
                chapter.appendChild(title);
            }
            if (record.image) {
                var image = new Image();
                image.src = record.image;
                chapter.appendChild(image);
            }
            if (record.description) {
                var desc = document.createElement('p');
                desc.innerHTML = record.description;
                chapter.appendChild(desc);
            }
            container.setAttribute('id', record.id);
            container.classList.add('step');
            if (idx === 0) container.classList.add('active');
            chapter.classList.add(config.theme);
            container.appendChild(chapter);
            container.classList.add(alignments[record.alignment] || 'centered');
            if (record.hidden) container.classList.add('hidden');
            features.appendChild(container);
        });

        story.appendChild(features);

        var footer = document.createElement('div');
        if (config.footer) {
            var footerText = document.createElement('p');
            footerText.innerHTML = config.footer;
            footer.appendChild(footerText);
        }
        if (footer.innerText.length > 0) {
            footer.classList.add(config.theme);
            footer.setAttribute('id', 'footer');
            story.appendChild(footer);
        }

        mapboxgl.accessToken = config.accessToken;

        const transformRequest = (url) => {
            const hasQuery = url.indexOf('?') !== -1;
            const suffix = hasQuery ? '&pluginName=scrollytellingV2' : '?pluginName=scrollytellingV2';
            return { url: url + suffix };
        };

        var map = new mapboxgl.Map({
            container: 'map',
            style: config.style,
            center: config.chapters[0].location.center,
            zoom: config.chapters[0].location.zoom,
            bearing: config.chapters[0].location.bearing,
            pitch: config.chapters[0].location.pitch,
            interactive: false,
            transformRequest: transformRequest
        });

        if (config.showMarkers) {
            var marker = new mapboxgl.Marker({ color: config.markerColor });
            marker.setLngLat(config.chapters[0].location.center).addTo(map);
        }

        var scroller = scrollama();

        map.on('load', function() {
            updateLegend(config.chapters[0].id);

            scroller.setup({
                step: '.step',
                offset: 0.5,
                progress: true
            })
            .onStepEnter(async response => {
                var current_chapter = config.chapters.findIndex(chap => chap.id === response.element.id);
                var chapter = config.chapters[current_chapter];
                response.element.classList.add('active');
                map[chapter.mapAnimation || 'flyTo'](chapter.location);
                if (config.showMarkers) marker.setLngLat(chapter.location.center);
                updateLegend(chapter.id);
                if (chapter.callback) window[chapter.callback]();
    
                // Wait for map to finish moving before applying layer opacity
                map.once('moveend', function() {
                if (chapter.onChapterEnter.length > 0) {
                chapter.onChapterEnter.forEach(setLayerOpacity);
            }
        });
    
    if (chapter.rotateAnimation) {
        map.once('moveend', () => {
            const rotateNumber = map.getBearing();
            map.rotateTo(rotateNumber + 180, { duration: 30000, easing: t => t });
        });
    }
})
            .onStepExit(response => {
                var chapter = config.chapters.find(chap => chap.id === response.element.id);
                response.element.classList.remove('active');
                if (chapter.onChapterExit.length > 0) chapter.onChapterExit.forEach(setLayerOpacity);
            });
        });

        window.addEventListener('resize', scroller.resize);
    </script>
</body>
</html>
